<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#16162c;--mute:#70708a;--line:#e3e3ee;--soft:#f6f6fb;--navy:#0e0e2a;--acc:#6e5ae6;--gn:#0f9d6b;--rd:#d93a5a;
  --grad:linear-gradient(90deg,#4f8ef7 0%,#a855f7 50%,#ec4899 100%);--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
html,body{background:#eceef5;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.paper{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(20,20,60,.08);overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:22px 22px 18px}
.top .logo{width:62px;height:62px;flex-shrink:0}
.top .logo svg{width:100%;height:100%;display:block}
.top h1{font-size:21px;line-height:1.2}
.top small{display:block;color:var(--mute);font-size:13px}
.top .ct{margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink)}
.bar{height:4px;background:var(--grad)}
.sec{padding:20px 22px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:none}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.title{font-size:22px;font-weight:800;line-height:1.25}
.intro{color:var(--mute);font-style:italic;margin-top:6px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.meta div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.meta b{display:block;font-size:11px;color:var(--acc);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
table{width:100%;border-collapse:collapse}
th{background:var(--navy);color:#fff;font-size:12px;text-align:left;padding:9px 12px}
th:last-child,td:last-child{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td .d{display:block;color:var(--mute);font-size:13px}
td.n{font-weight:700;white-space:nowrap}
.opt th{background:#fff4e6;color:#965a0a}
.tot{margin-top:14px;margin-left:auto;max-width:360px;background:var(--soft);border-radius:12px;overflow:hidden}
.tot div{display:flex;justify-content:space-between;padding:6px 14px;font-size:14px}
.tot .m{color:var(--mute)}
.tot .big{background:var(--navy);color:#fff;font-weight:800;font-size:17px;padding:12px 14px;position:relative}
.tot .big::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
ul.terms{padding-left:18px;color:var(--mute);font-size:13px}
ul.terms li{margin-bottom:4px}
.bank{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:12px 14px;margin-top:12px}
.bank b{font-size:16px;letter-spacing:.02em}
.card{background:#fbfaff;border:1px solid #e4defc;border-radius:16px;padding:18px}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 5px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid #c9bdfb;border-color:var(--acc)}
textarea{min-height:84px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.g2{grid-template-columns:1fr}.top .ct{display:none}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{margin:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:30px;padding:8px 14px;font-size:14px;color:var(--ink);cursor:pointer;background:#fff;font-weight:500}
.seg input{width:auto}
.seg label.on{border-color:var(--acc);background:#f1edff}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--ink);font-weight:500}
.chk input{width:auto;margin-top:4px}
.btn{display:block;width:100%;margin-top:16px;border:none;border-radius:12px;padding:15px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,#4f8ef7,#a855f7 55%,#ec4899);cursor:pointer;box-shadow:0 8px 24px rgba(110,90,230,.3)}
.btn:disabled{opacity:.55}
.ok{background:#ebfaf3;border:1px solid #b8ead5;color:#0b6b48;border-radius:14px;padding:16px;font-size:15px}
.ok h3{font-size:18px;margin-bottom:4px}
.err{color:var(--rd);font-size:13px;margin-top:10px}
.pl-row{display:flex;gap:8px}
.pl-row input{flex:1}
.pl-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pl-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.pl-item .ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;flex-shrink:0}
.pl-item .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.pl-item b{display:block;color:var(--ink)}
.x{border:none;background:#f1f1f7;color:var(--mute);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;flex-shrink:0}
.sbtn{border:none;border-radius:10px;padding:0 16px;font:inherit;font-weight:700;background:var(--navy);color:#fff;cursor:pointer}
.res{border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;background:#fff}
.res button{display:flex;align-items:center;gap:10px;width:100%;border:none;border-bottom:1px solid var(--line);background:#fff;padding:8px 10px;text-align:left;font:inherit;cursor:pointer}
.res button:last-child{border-bottom:none}
.res button:hover{background:#f7f5ff}
.res img,.song img{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#eee;flex-shrink:0}
.res .t,.song .t{flex:1;min-width:0}
.res .t b,.song .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .t span,.song .t span{font-size:12px;color:var(--mute)}
.res .plus{font-size:20px;color:var(--acc);font-weight:700}
.songs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.song{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:14px 0 2px}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:18px}
.center{text-align:center;padding:60px 20px;color:var(--mute)}
.hide{display:none!important}
</style>
</head>

};
const PLATFORMS=[[/spotify\.com|spotify\.link/,'Spotify','#1DB954','S'],[/music\.apple\.com/,'Apple Music','#fa2d48',''],[/music\.amazon\.|amazon\.[a-z.]+\/music/,'Amazon Music','#25d1da','a'],[/music\.youtube\.com|youtube\.com|youtu\.be/,'YouTube Music','#ff0000','▶'],[/deezer\.com|deezer\.page\.link/,'Deezer','#a238ff','D'],[/soundcloud\.com/,'SoundCloud','#ff5500','☁'],[/tidal\.com/,'Tidal','#000000','T']];
function platformOf(u){ for(const [re,n,c,i] of PLATFORMS) if(re.test(u)) return {n,c,i}; return {n:'Playlist',c:'#6e5ae6',i:'♪'}; }
function cleanUrl(u){ try{ const x=new URL(u.trim()); return /^https?:$/.test(x.protocol)?x.href.slice(0,500):''; }catch{ return ''; } }
let QPL=[], QSONGS=[];
const GENRES=['Pop','Dance / House','Anni 70-80-90','Latino / Reggaeton','Rock','Hip hop / R&B','Italiana','Jazz / Lounge','Afro','Disco / Funk'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>'€ '+Number(n||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
let O=null, L=T.it, ref=null, token=new URLSearchParams(location.search).get('t');
const fmtD=(s,lang)=>new Date(s+'T12:00:00').toLocaleDateString(lang==='en'?'en-GB':'it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

async function load(){
  if(!token){ $('loading').textContent=T.it.notfound; return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    ref=firebase.firestore().collection('offers').doc(token);
    ref.onSnapshot(d=>{ if(!d.exists){ $('loading').textContent=T.it.notfound+' / '+T.en.notfound; return; } O=d.data(); render(); },
      e=>{ $('loading').textContent=T.it.notfound+' / '+T.en.notfound; console.error(e); });
  }catch(e){ $('loading').textContent='Errore di connessione.'; console.error(e); }
}
function render(){
  L=T[O.lang]||T.it; document.documentElement.lang=O.lang||'it';
  const b=O.biz||{}, ev=O.event||{}, t=O.totals||{};
  document.title=(O.lang==='en'?'Quote':'Preventivo')+' – '+(b.name||'DJ');
  $('b-name').textContent=b.name||''; $('b-tag').textContent=b.tagline||'';
  $('b-ct').innerHTML=[b.phone,b.email].filter(Boolean).map(esc).join('<br>');
  $('k-title').textContent=L.quote+(O.quoteNo?' · '+L.no+' '+O.quoteNo:'');
  $('ev-title').textContent=ev.title||'';
  $('ev-intro').textContent=L.intro(ev.contact);
  const dates=ev.confirmedDate?[ev.confirmedDate]:(ev.dates||[]);
  $('ev-meta').innerHTML=[[L.date,dates.map(d=>fmtD(d,O.lang)).join(L.or)],[L.time,ev.from?ev.from+(ev.to?' – '+ev.to:''):''],[L.venue,[ev.venue,ev.room].filter(Boolean).join(' – ')],[L.guests,ev.pax],[L.client,ev.client]]
    .filter(r=>r[1]).map(([k,v])=>`<div><b>${esc(k)}</b>${esc(v)}</div>`).join('');
  $('t-lines').innerHTML=`<tr><th>${L.desc}</th><th style="text-align:center">${L.qty}</th><th>${L.amt}</th></tr>`+
    (O.lines||[]).map(l=>`<tr><td><b>${esc(l.name)}</b>${l.desc?`<span class="d">${esc(l.desc)}</span>`:''}</td><td style="text-align:center">${l.qty||1}</td><td class="n">${eur(l.amount)}</td></tr>`).join('');
  $('t-tot').innerHTML=(t.withholding?`<div><span>${L.gross}</span><span>${eur(t.feeGross)}</span></div><div class="m"><span>${L.wh}</span><span>– ${eur(t.wh)}</span></div><div class="m"><span>${L.net}</span><span>${eur(t.feeNet)}</span></div>`
    :`<div><span>${L.fee}</span><span>${eur(t.feeNet)}</span></div>`)+(t.exp?`<div><span>${L.exp}</span><span>${eur(t.exp)}</span></div>`:'')+
    `<div class="big"><span>${L.tot}</span><span>${eur(t.clientTotal)}</span></div>`;
  $('t-note').textContent=O.totalsNote||'';
  $('t-opt').innerHTML=(O.optional||[]).length?`<tr><th>${L.opt}</th><th>${L.amt}</th></tr>`+O.optional.map(l=>`<tr><td><b>${esc(l.name)}</b>${l.desc?`<span class="d">${esc(l.desc)}</span>`:''}</td><td class="n">${eur(l.amount)}</td></tr>`).join(''):'';
  $('k-terms').textContent=L.terms;
  $('terms').innerHTML=(O.terms||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  const bk=O.bank||{};
  $('bank').classList.toggle('hide',!bk.iban);
  if(bk.iban) $('bank').innerHTML=`<div class="kicker">${L.bank}</div><b>IBAN ${esc(bk.iban)}</b><div class="note">${[bk.holder?L.holder+': '+esc(bk.holder):'',[bk.name,bk.address].filter(Boolean).map(esc).join(', ')].filter(Boolean).join(' · ')}</div>`;
  $('foot').textContent=[b.legalName||b.name,b.cf].filter(Boolean).join(' · ');
  renderAccept(); renderQuest();
  $('loading').classList.add('hide'); $('paper').classList.remove('hide');
}
function renderAccept(){
  const box=$('s-accept'), a=O.acceptance;
  if(O.status==='withdrawn'){ box.innerHTML=`<div class="center" style="padding:20px">${L.expired}</div>`; return; }
  if(a){
    const d=a.date||O.event?.confirmedDate||(O.event?.dates||[])[0];
    box.innerHTML=`<div class="ok"><h3>✅ ${L.done}</h3>${d?L.doneSub(fmtD(d,O.lang)):''}<div class="note" style="color:#0b6b48">${L.accepted+new Date(a.at).toLocaleString(O.lang==='en'?'en-GB':'it-IT')} · ${esc(a.name)}</div></div>`;
    return;
  }
  const dates=O.event?.confirmedDate?[O.event.confirmedDate]:(O.event?.dates||[]);
  box.innerHTML=`<div class="card">
    <div class="title" style="font-size:19px">${L.accTitle}</div><div class="note" style="font-size:14px">${L.accSub}</div>
    ${dates.length>1?`<label>${L.pick} *</label><div class="seg" id="a-date">${dates.map((d,i)=>`<label><input type="radio" name="d" value="${d}" ${i===0?'checked':''}>${esc(fmtD(d,O.lang))}</label>`).join('')}</div>`:''}
    <label>${L.type}</label><div class="seg" id="a-type"><label class="on"><input type="radio" name="tp" value="company" checked>${L.company}</label><label><input type="radio" name="tp" value="private">${L.private}</label></div>
    <label>${L.cname} *</label><input id="a-name" autocomplete="organization" value="${esc(O.event?.client||'')}">
    <div class="g2"><div><label>${L.vat} *</label><input id="a-vat"></div><div id="a-sdi-w"><label>${L.sdi}</label><input id="a-sdi"></div></div>
    <label>${L.addr} *</label><input id="a-addr" autocomplete="street-address">
    <div class="g2"><div><label>${L.ref} *</label><input id="a-ref" autocomplete="name" value="${esc(O.event?.contact||'')}"></div><div><label>${L.email} *</label><input id="a-email" type="email" autocomplete="email"></div></div>
    <label>${L.phone}</label><input id="a-phone" type="tel" autocomplete="tel">
    <label class="chk"><input type="checkbox" id="a-ok"> ${L.agree}</label>
    <button class="btn" id="a-btn" onclick="accept()">${L.btn}</button>
    <div class="err hide" id="a-err"></div></div>`;
  box.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('change',()=>seg.querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked))));
  box.querySelectorAll('#a-date label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
  $('a-type').addEventListener('change',()=>$('a-sdi-w').classList.toggle('hide',document.querySelector('input[name=tp]:checked').value==='private'));
}
async function accept(){
  const v=id=>($(id)?.value||'').trim();
  const d=document.querySelector('input[name=d]:checked')?.value||O.event?.confirmedDate||(O.event?.dates||[])[0]||'';
  const tp=document.querySelector('input[name=tp]:checked')?.value||'company';
  const err=$('a-err');
  if(!v('a-name')||!v('a-vat')||!v('a-addr')||!v('a-ref')||!/^\S+@\S+\.\S+$/.test(v('a-email'))||!$('a-ok').checked){ err.textContent=L.need; err.classList.remove('hide'); return; }
  err.classList.add('hide');
  const btn=$('a-btn'); btn.disabled=true; btn.textContent=L.sending;
  try{
    const now=new Date().toISOString();
    await ref.update({acceptance:{type:tp,name:v('a-name').slice(0,200),vat:v('a-vat').slice(0,40),address:v('a-addr').slice(0,300),sdi:v('a-sdi').slice(0,120),
      contact:v('a-ref').slice(0,120),email:v('a-email').slice(0,160),phone:v('a-phone').slice(0,40),date:d,at:now},clientUpdatedAt:now});
  }catch(e){ console.error(e); err.textContent=e.message; err.classList.remove('hide'); btn.disabled=false; btn.textContent=L.btn; }
}
function renderQuest(){
  const box=$('s-quest');
  const show=!!(O.acceptance||O.eventConfirmed);
  box.classList.toggle('hide',!show);
  if(!show) return;
  if(box.dataset.ready==='1'){ return; }
  box.dataset.ready='1';
  const q=O.questionnaire||{};
  box.innerHTML=`<div class="title" style="font-size:19px">${L.qTitle}</div><div class="note" style="font-size:14px">${L.qSub}</div>
    <label style="font-size:14px;color:var(--ink)">🎧 ${L.plTitle}</label><div class="note" style="margin:-2px 0 6px">${L.plSub}</div>
    <div class="pl-row"><input id="q-pl" type="url" inputmode="url" placeholder="${esc(L.plPh)}" onkeydown="if(event.key==='Enter'){event.preventDefault();addPl()}"><button class="sbtn" type="button" onclick="addPl()">${L.plAdd}</button></div>
    <div class="err hide" id="q-pl-err">${L.plBad}</div>
    <div class="pl-list" id="q-pls"></div>
    <div class="or">${L.orSearch}</div>
    <div class="pl-row"><input id="q-s" placeholder="${esc(L.searchPh)}" autocomplete="off" oninput="searchSoon()" onkeydown="if(event.key==='Enter'){event.preventDefault();searchSongs()}"><button class="sbtn" type="button" onclick="searchSongs()">${L.search}</button></div>
    <div class="res hide" id="q-res"></div>
    <div class="songs" id="q-songs"></div>
    <label>${L.must}</label><textarea id="q-must" style="min-height:60px" placeholder="${esc(L.mustPh)}">${esc(q.mustPlay||'')}</textarea>
    <label>${L.no2}</label><textarea id="q-no" style="min-height:60px">${esc(q.doNotPlay||'')}</textarea>
    <label>${L.moments}</label><textarea id="q-mom" style="min-height:60px" placeholder="${esc(L.momentsPh)}">${esc(q.moments||'')}</textarea>
    <label>${L.sched}</label><textarea id="q-sched" style="min-height:60px" placeholder="${esc(L.schedPh)}">${esc(q.schedule||'')}</textarea>
    <label>${L.genres}</label><div class="seg" id="q-gen">${GENRES.map(g=>`<label class="${(q.genres||[]).includes(g)?'on':''}"><input type="checkbox" value="${esc(g)}" ${(q.genres||[]).includes(g)?'checked':''}>${esc(g)}</label>`).join('')}</div>
    <label>${L.energy}</label><div class="seg" id="q-en">${['e1','e2','e3'].map(k=>`<label class="${q.energy===k?'on':''}"><input type="radio" name="en" value="${k}" ${q.energy===k?'checked':''}>${L[k]}</label>`).join('')}</div>
    <label>${L.notes}</label><textarea id="q-notes" style="min-height:60px">${esc(q.notes||'')}</textarea>
    <button class="btn" id="q-btn" onclick="saveQuest()">${L.qBtn}</button><div class="ok hide" id="q-ok" style="margin-top:12px">${L.qSaved}</div>`;
  box.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('change',()=>seg.querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked))));
  QPL=(q.playlists||[]).slice(); QSONGS=(q.songs||[]).slice(); renderPls(); renderSongs();
}
function addPl(){
  const u=cleanUrl($('q-pl').value);
  $('q-pl-err').classList.toggle('hide',!!u);
  if(!u) return;
  if(!QPL.includes(u)&&QPL.length<8) QPL.push(u);
  $('q-pl').value=''; renderPls();
}
function renderPls(){
  $('q-pls').innerHTML=QPL.map((u,i)=>{const p=platformOf(u);return `<div class="pl-item"><span class="ic" style="background:${p.c}">${esc(p.i)}</span><div class="u"><b>${esc(p.n)}</b><a href="${esc(u)}" target="_blank" rel="noopener" style="color:inherit">${esc(u.replace(/^https?:\/\//,''))}</a></div><button class="x" type="button" onclick="QPL.splice(${i},1);renderPls()">✕</button></div>`}).join('');
}
let sTimer=null, sSeq=0;
function searchSoon(){ clearTimeout(sTimer); sTimer=setTimeout(searchSongs,350); }
async function searchSongs(){
  const q=$('q-s').value.trim(), box=$('q-res');
  if(q.length<2){ box.classList.add('hide'); return; }
  const my=++sSeq;
  try{
    const r=await fetch('api/search?q='+encodeURIComponent(q)+'&limit=6'); const d=await r.json();
    if(my!==sSeq) return;
    const res=(d.results||[]).filter(t=>t.trackName);
    window.__res=res;
    box.innerHTML=res.length?res.map((t,i)=>`<button type="button" onclick="pickSong(${i})"><img src="${esc(t.artworkUrl60||'')}" alt="" onerror="this.style.visibility='hidden'"><span class="t"><b>${esc(t.trackName)}</b><span>${esc(t.artistName||'')}</span></span><span class="plus">+</span></button>`).join(''):`<div style="padding:10px;color:var(--mute);font-size:13px">${L.noRes}</div>`;
    box.classList.remove('hide');
  }catch(e){ console.warn(e); box.classList.add('hide'); }
}
function pickSong(i){
  const t=(window.__res||[])[i]; if(!t) return;
  const s={t:t.trackName.slice(0,150),a:(t.artistName||'').slice(0,150),img:(t.artworkUrl100||t.artworkUrl60||'').slice(0,300)};
  if(!QSONGS.some(x=>x.t===s.t&&x.a===s.a)&&QSONGS.length<60) QSONGS.push(s);
  $('q-s').value=''; $('q-res').classList.add('hide'); renderSongs();
}
function renderSongs(){
  $('q-songs').innerHTML=QSONGS.length?`<div class="note" style="margin-top:4px">${L.mySongs} · ${QSONGS.length}</div>`+QSONGS.map((s,i)=>`<div class="song"><img src="${esc(s.img)}" alt="" onerror="this.style.visibility='hidden'"><span class="t"><b>${esc(s.t)}</b><span>${esc(s.a)}</span></span><button class="x" type="button" onclick="QSONGS.splice(${i},1);renderSongs()">✕</button></div>`).join(''):'';
}
async function saveQuest(){
  const v=id=>($(id)?.value||'').trim().slice(0,3000);
  const btn=$('q-btn'); btn.disabled=true;
  try{
    const now=new Date().toISOString();
    if($('q-pl').value.trim()) addPl();
    await ref.update({questionnaire:{playlists:QPL.slice(0,8),songs:QSONGS.slice(0,60),mustPlay:v('q-must'),doNotPlay:v('q-no'),moments:v('q-mom'),schedule:v('q-sched'),
      genres:[...document.querySelectorAll('#q-gen input:checked')].map(i=>i.value),energy:document.querySelector('input[name=en]:checked')?.value||'',notes:v('q-notes'),at:now},clientUpdatedAt:now});
    $('q-ok').classList.remove('hide');
  }catch(e){ console.error(e); alert(e.message); }
  finally{ btn.disabled=false; }
}
load();
</script>
</body>
</html>
