<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#070714">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>DjSeanMartins</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#070714;color:#fff}
:root{
  --bg0:#070714;--bg1:#0e0e2a;--bg2:#161630;--bg3:#1e1e3f;
  --ac:#4f8ef7;--ac2:#7eb3ff;--acb:rgba(79,142,247,.15);
  --b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.14);
  --tx:rgba(255,255,255,.95);--tx2:rgba(255,255,255,.55);--tx3:rgba(255,255,255,.25);
  --rs:10px;--r:16px;--sb:env(safe-area-inset-bottom,0px);
  --grad:linear-gradient(135deg,#4f8ef7 0%,#a855f7 50%,#ec4899 100%);
}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(var(--sb)+40px)}

/* Hero */
.hero{position:relative;height:180px;overflow:hidden;background:linear-gradient(135deg,#1a0a2e,#0d1a3a)}
.hero-bg1{position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:rgba(79,142,247,0.12)}
.hero-bg2{position:absolute;bottom:-60px;left:40px;width:160px;height:160px;border-radius:50%;background:rgba(168,85,247,0.08)}
.hero-brand{position:absolute;bottom:14px;right:16px;font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:3px;text-transform:uppercase}
.avatar-wrap{position:absolute;bottom:-40px;left:24px}
.avatar{width:80px;height:80px;border-radius:50%;border:3px solid #070714;overflow:hidden;background:var(--bg3)}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Profile info */
.profile-info{padding:52px 24px 24px}
.dj-name{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dj-title{font-size:12px;color:var(--ac2);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
.dj-bio{font-size:14px;color:var(--tx2);line-height:1.6;margin-bottom:24px}

/* Section */
.section{padding:0 16px 20px}
.section-title{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}

/* Contact rows */
.contact-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg1);border:1px solid var(--b);border-radius:var(--rs);margin-bottom:8px;text-decoration:none;color:var(--tx)}
.contact-row:active{opacity:.7}
.contact-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact-label{font-size:11px;color:var(--tx2)}
.contact-value{font-size:13px;font-weight:500}

/* Tip */
.tip-section{padding:0 16px 20px}
.tip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.tip-btn{padding:12px 6px;background:var(--bg1);border:1px solid var(--b);border-radius:var(--rs);cursor:pointer;text-align:center;font-family:inherit;color:var(--tx);transition:all .2s}
.tip-btn.on{border-color:#ffb347;background:rgba(255,179,71,.1);color:#ffb347}
.tip-amount{font-size:17px;font-weight:700}
.tip-label{font-size:9px;color:var(--tx3);margin-top:2px}
.tip-btn.on .tip-label{color:#ffb347}

/* Social */
.social-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg1);border:1px solid var(--b);border-radius:var(--rs);margin-bottom:8px;text-decoration:none;color:var(--tx);font-size:13px;font-weight:500}
.social-row:active{opacity:.7}

/* Divider */
.divider{height:1px;background:var(--b);margin:4px 16px 20px}

/* Footer */
.footer{text-align:center;padding:0 16px;font-size:11px;color:var(--tx3)}

#toast{position:fixed;bottom:calc(var(--sb)+24px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--b2);color:var(--tx);padding:10px 18px;border-radius:30px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:999;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <div class="hero">
    <div class="hero-bg1"></div>
    <div class="hero-bg2"></div>
    <div class="hero-brand">SpinRequest</div>
    <div class="avatar-wrap">
      <div class="avatar" id="dj-avatar">
        <img id="dj-photo" src="" alt="" style="display:none">
      </div>
    </div>
  </div>

  <div class="profile-info">
    <div class="dj-name" id="dj-name">DjSeanMartins</div>
    <div class="dj-title" id="dj-title">International DJ · Florence</div>
    <div class="dj-bio" id="dj-bio">International Dj base in Florence</div>
  </div>

  <!-- Contatti -->
  <div class="section">
    <div class="section-title">📇 Contatti</div>
    <div id="contacts"></div>
  </div>

  <div class="divider"></div>

  <!-- Tips -->
  <div class="tip-section" id="tip-section" style="display:none">
    <div class="section-title">💸 Lascia una mancia</div>
    <div class="tip-grid">
      <button class="tip-btn" onclick="selectTip(2)"><div class="tip-amount">2€</div><div class="tip-label">Grazie</div></button>
      <button class="tip-btn" onclick="selectTip(3)"><div class="tip-amount">3€</div><div class="tip-label">Top</div></button>
      <button class="tip-btn" onclick="selectTip(5)"><div class="tip-amount">5€</div><div class="tip-label">Grande</div></button>
      <button class="tip-btn" onclick="selectTip(10)"><div class="tip-amount">10€</div><div class="tip-label">Leggenda</div></button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
      <span style="font-size:13px;color:var(--tx2);white-space:nowrap">Oppure:</span>
      <input type="number" id="custom-tip" placeholder="Cifra libera €" min="1" step="1" oninput="selectTip(parseFloat(this.value)||0,true)" style="flex:1;background:var(--bg2);border:1px solid var(--b);border-radius:var(--rs);color:var(--tx);font-size:14px;padding:10px 12px;outline:none">
    </div>
    <a id="paypal-btn" href="#" target="_blank"
      style="display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;background:linear-gradient(135deg,#003087,#009cde);border-radius:var(--rs);color:#fff;font-weight:700;font-size:14px;text-decoration:none">
      💙 Paga con PayPal
    </a>
    <div style="text-align:center;font-size:11px;color:var(--tx3);margin-top:6px">Opzionale — grazie per il supporto! 🙏</div>
  </div>

  <div class="divider" id="tip-divider" style="display:none"></div>

  <!-- Social -->
  <div class="section">
    <div class="section-title">📲 Seguimi</div>
    <div id="social-follow"></div>
    <div style="font-size:11px;color:var(--tx2);margin:12px 0 8px">Tagga e condividi la tua esperienza!</div>
    <div id="social-share"></div>
  </div>

  <div class="footer">
    <div style="margin-bottom:4px">SpinRequest · © DjSeanMartins</div>
    <div style="font-style:italic;color:rgba(255,255,255,0.2)">Where the beat meets the soul</div>
  </div>

</div>
<div id="toast"></div>

<script>
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyC2pfiikTAuxdwux63ZG_HnfEwrnj6auJw",
  authDomain:"spinrequest-c0aa1.firebaseapp.com",
  projectId:"spinrequest-c0aa1",
  storageBucket:"spinrequest-c0aa1.firebasestorage.app",
  messagingSenderId:"511829854416",
  appId:"1:511829854416:web:91e0ddba6790d5352d36d5"
};

const DJ_UID = 'mkLIvGmW6NZ2QZHHj0vIhDtddYk1';

let paypalLink = '';
let selectedTip = 0;

const $ = id => document.getElementById(id);
function toast(msg,dur=2500){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}

function cleanHandle(val){
  if(!val) return '';
  try{const u=new URL(val.startsWith('http')?val:'https://'+val);const parts=u.pathname.split('/').filter(Boolean);return parts[0]||val;}
  catch(e){return val.replace('@','').split(/[?&#]/)[0];}
}

window.addEventListener('DOMContentLoaded', async () => {
  firebase.initializeApp(FIREBASE_CONFIG);
  const DB = firebase.firestore();
  try {
    const doc = await DB.collection('djs').doc(DJ_UID).get();
    const dj = doc.data() || {};

    // Avatar
    if(dj.photo){
      const img = $('dj-photo');
      img.src = dj.photo; img.style.display='block';
      $('dj-avatar').style.background='transparent';
    } else {
      $('dj-avatar').textContent = (dj.djName||'DJ').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
      $('dj-avatar').style.display='flex'; $('dj-avatar').style.alignItems='center'; $('dj-avatar').style.justifyContent='center';
      $('dj-avatar').style.fontSize='24px'; $('dj-avatar').style.fontWeight='700'; $('dj-avatar').style.color='#fff';
    }

    // Name & bio
    if(dj.djName) $('dj-name').textContent = dj.djName;
    if(dj.bio) $('dj-bio').textContent = dj.bio;

    // Contacts
    const c = $('contacts');
    let h = '';
    if(dj.phone){
      const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${dj.djName||'DJ'}\nTEL:${dj.phone}\n${dj.email?'EMAIL:'+dj.email+'\n':''}END:VCARD`;
      const vcUrl = URL.createObjectURL(new Blob([vcard],{type:'text/vcard'}));
      h += `<a href="tel:${dj.phone}" class="contact-row">
        <div class="contact-icon" style="background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.25)">📱</div>
        <div style="flex:1"><div class="contact-label">Telefono</div><div class="contact-value">${dj.phone}</div></div>
        <a href="${vcUrl}" download="${(dj.djName||'DJ').replace(/\s+/g,'_')}.vcf" onclick="event.stopPropagation()" style="font-size:11px;background:var(--acb);color:var(--ac2);padding:4px 10px;border-radius:20px;text-decoration:none;flex-shrink:0">+ Salva</a>
      </a>`;
    }
    if(dj.email) h += `<a href="mailto:${dj.email}" class="contact-row">
      <div class="contact-icon" style="background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.2)">📧</div>
      <div><div class="contact-label">Email</div><div class="contact-value" style="font-size:12px">${dj.email}</div></div>
    </a>`;
    c.innerHTML = h || '<div style="font-size:13px;color:var(--tx3)">—</div>';

    // Tips
    if(dj.paypalLink){
      paypalLink = dj.paypalLink;
      $('tip-section').style.display='block';
      $('tip-divider').style.display='block';
    }

    // Social follow
    const ig = cleanHandle(dj.instagram);
    const tt = cleanHandle(dj.tiktok);
    const sf = $('social-follow');
    let sh = '';
    if(ig) sh += `<a href="https://instagram.com/${ig}" target="_blank" class="social-row"><span style="font-size:20px">📸</span><div><div>Instagram</div><div style="font-size:11px;color:var(--tx2)">@${ig}</div></div></a>`;
    if(tt) sh += `<a href="https://tiktok.com/@${tt}" target="_blank" class="social-row"><span style="font-size:20px">🎵</span><div><div>TikTok</div><div style="font-size:11px;color:var(--tx2)">@${tt}</div></div></a>`;
    sf.innerHTML = sh || '<div style="font-size:13px;color:var(--tx3)">—</div>';

    // Social share
    const ss = $('social-share');
    let shs = '';
    if(ig) shs += `<a href="https://www.instagram.com/${ig}" target="_blank" class="social-row" style="background:rgba(131,58,180,.1);border-color:rgba(131,58,180,.3)"><span style="font-size:20px">📸</span><div><div>Tagga su Instagram</div><div style="font-size:11px;color:var(--tx2)">@${ig} #SpinRequest</div></div></a>`;
    if(tt) shs += `<a href="https://www.tiktok.com/@${tt}" target="_blank" class="social-row"><span style="font-size:20px">🎵</span><div><div>Tagga su TikTok</div><div style="font-size:11px;color:var(--tx2)">@${tt} #SpinRequest</div></div></a>`;
    if(navigator.share) shs += `<button onclick="navigator.share({title:'DjSeanMartins',text:'Dai un\\'occhiata al profilo di DjSeanMartins!',url:location.href})" class="social-row" style="width:100%;cursor:pointer;background:var(--acb);border-color:rgba(79,142,247,.3)"><span style="font-size:20px">🔗</span><div><div>Condividi profilo</div><div style="font-size:11px;color:var(--tx2)">Invia il link agli amici</div></div></button>`;
    ss.innerHTML = shs;

  } catch(e){ console.error(e); }
});

function selectTip(amount, fromInput=false){
  selectedTip = amount;
  if(!fromInput) $('custom-tip').value='';
  document.querySelectorAll('.tip-btn').forEach(b=>b.classList.remove('on'));
  if(!fromInput){const map={2:0,3:1,5:2,10:3};const i=map[amount];if(i!==undefined)document.querySelectorAll('.tip-btn')[i].classList.add('on');}
  if(paypalLink && amount > 0){
    const base = paypalLink.replace(/\/$/, '');
    let url = base.includes('paypal.me/') ? base+'/'+amount : base+'?amount='+amount+'&currencyCode=EUR';
    $('paypal-btn').href = url;
  }
}
</script>
</body>
</html>
